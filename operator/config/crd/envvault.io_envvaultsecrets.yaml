---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: envvaultsecrets.envvault.io
spec:
  group: envvault.io
  names:
    kind: EnvVaultSecret
    listKind: EnvVaultSecretList
    plural: envvaultsecrets
    shortNames:
    - evs
    singular: envvaultsecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.environment
      name: Env
      type: string
    - jsonPath: .status.keyCount
      name: Keys
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastSyncTime
      name: Synced
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EnvVaultSecret keeps a Kubernetes Secret in step with one EnvVault
          environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvVaultSecretSpec says which environment to read and where
              to put it.
            properties:
              environment:
                description: Environment to read, e.g. `production`.
                minLength: 1
                type: string
              hub:
                description: Hub overrides the hub address and how to trust it.
                properties:
                  allowPlainHTTP:
                    description: AllowPlainHTTP permits an http:// hub. The token
                      would cross the network in the clear.
                    type: boolean
                  caSecretRef:
                    description: CASecretRef holds a PEM bundle to trust, e.g. the
                      hub's self-signed certificate.
                    properties:
                      key:
                        description: Key inside the Secret. Defaults to `token` for
                          the service token and `ca.crt` for a CA bundle.
                        type: string
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  fingerprint:
                    description: Fingerprint pins the hub's certificate (SHA-256,
                      hex, colons optional). The hub prints it at start-up.
                    type: string
                  insecureSkipVerify:
                    description: InsecureSkipVerify disables certificate checks. For
                      testing only.
                    type: boolean
                  url:
                    description: URL of the hub. Defaults to the address inside the
                      service token.
                    type: string
                type: object
              project:
                description: Project the environment belongs to.
                minLength: 1
                type: string
              refreshInterval:
                description: RefreshInterval between checks of the hub (minimum 10s,
                  default 60s). Only a change is downloaded.
                type: string
              restartOn:
                description: RestartOn lists workloads to roll (by changing a pod-template
                  annotation) when the values change.
                items:
                  description: WorkloadRef names a workload in the same namespace
                    to roll when the secret changes.
                  properties:
                    kind:
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      type: string
                    name:
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
              target:
                description: Target Secret to create and keep up to date.
                properties:
                  name:
                    description: Name of the Secret. Defaults to the name of this
                      resource.
                    type: string
                  type:
                    default: Opaque
                    description: Type of the Secret.
                    type: string
                type: object
              tokenSecretRef:
                description: TokenSecretRef holds the service token (evt_…) created
                  in the EnvVault dashboard.
                properties:
                  key:
                    description: Key inside the Secret. Defaults to `token` for the
                      service token and `ca.crt` for a CA bundle.
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - environment
            - project
            - tokenSecretRef
            type: object
          status:
            description: EnvVaultSecretStatus reports the last sync. It never contains
              values.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: |-
                  ConsecutiveFailures counts failed syncs in a row. While it is above zero the operator
                  backs off (up to 5 minutes) instead of retrying at the refresh interval.
                type: integer
              expiryWarnedDays:
                description: ExpiryWarnedDays is the nearest expiry warning already
                  raised (14, 7, 3 or 1 days).
                type: integer
              keyCount:
                description: KeyCount is how many keys the Secret holds.
                type: integer
              lastSyncTime:
                description: LastSyncTime is when the Secret was last written.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
              observedVersion:
                description: ObservedVersion is the hub version last written to the
                  Secret.
                type: string
              tokenExpiresAt:
                description: TokenExpiresAt is when the service token stops working,
                  if the hub says.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
