apiVersion: v1
kind: Namespace
metadata:
  name: envvault-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envvault-operator
  namespace: envvault-system
  labels: { app.kubernetes.io/name: envvault-operator }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: envvault-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: envvault-operator }
    spec:
      serviceAccountName: envvault-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: ghcr.io/iserp-cloud/envvault-operator:0.1.0 # build from operator/Dockerfile; set your own registry
          imagePullPolicy: Always # pulls on every start, so a re-pushed tag is picked up; pin a version tag in production
          args:
            - --health-probe-bind-address=:8081
            # Dashboard links start once the Secret envvault-system/envvault-cluster-token exists.
            # Where they may write, and the hub address and certificate pin if the cluster token's address is not enough,
            # are read live from the optional ConfigMap envvault-system/envvault-config (see README).
          ports:
            - { name: health, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
