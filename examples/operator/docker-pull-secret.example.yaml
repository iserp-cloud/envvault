# Only if the operator image is in a private registry. Make the Secret with kubectl instead of a file:
#
#   kubectl -n envvault-system create secret docker-registry registry-pull-secret \
#     --docker-server=registry.example.com --docker-username=USER --docker-password=PASSWORD
#
# then let the operator use it (install.yaml has no imagePullSecrets, so this is one extra step):
#
#   kubectl -n envvault-system patch serviceaccount envvault-operator \
#     -p '{"imagePullSecrets":[{"name":"registry-pull-secret"}]}'
#   kubectl -n envvault-system rollout restart deploy/envvault-operator
#
# A manifest of it, if you keep one, belongs in a git-ignored file named *pull-secret*.yaml.
