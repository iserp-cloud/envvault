# The hub's two secrets. Copy to secret.yaml (git-ignored), fill in, then:  kubectl apply -f secret.yaml
#
#   DATABASE_URL    postgres://user:password@host:5432/envvault?sslmode=verify-full   (a new, empty database)
#   ENVVAULT_PEPPER a long random string, kept for the life of the vault:  openssl rand -base64 48
#                   Losing or changing it locks everyone out, so store a copy in your secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: envvault
  namespace: envvault
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/envvault?sslmode=verify-full"
  ENVVAULT_PEPPER: "REPLACE_WITH_openssl_rand_-base64_48"
