apiVersion: v1
kind: Namespace
metadata:
  name: envvault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envvault
  namespace: envvault
spec:
  replicas: 1
  selector:
    matchLabels: { app: envvault }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: envvault }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: hub
          image: ghcr.io/your-org/envvault:1.0.0 # build from ./Dockerfile and push to your registry
          imagePullPolicy: Always # pulls on every start, so a re-pushed tag is picked up; pin a version tag in production
          args: ["dist-hub/index.js", "serve", "--host", "0.0.0.0"]
          ports:
            - { name: http, containerPort: 3847 }
          env:
            - { name: ENVVAULT_SIGNUP, value: "invite" } # invite | open | closed
            - { name: ENVVAULT_TRUSTED_PROXIES, value: "0" } # no proxy in front (NodePort): ignore X-Forwarded-For, it can be forged
            - { name: ENVVAULT_HSTS, value: "false" } # browsers ignore HSTS on IP addresses; set "true" behind a real https hostname
            - { name: ENVVAULT_SESSION_DAYS, value: "14" }
            - { name: ENVVAULT_TLS_CERT, value: /tls/tls.crt } # https from tls.yaml (cert-manager)
            - { name: ENVVAULT_TLS_KEY, value: /tls/tls.key }
          envFrom:
            - secretRef: { name: envvault } # DATABASE_URL, ENVVAULT_PEPPER
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: http, scheme: HTTPS } # kubelet doesn't verify the certificate
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: tls
          secret: { secretName: envvault-tls, defaultMode: 0440 } # created by tls.yaml
      imagePullSecrets: # only for a private registry: see docker-pull-secret.example.yaml; delete these two lines otherwise
        - name: registry-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: envvault
  namespace: envvault
spec:
  selector: { app: envvault }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envvault
  namespace: envvault
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: envvault }
