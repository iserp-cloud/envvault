# Only for a private registry. Don't write this file by hand; let kubectl make it (nothing is saved to disk):
#
#   kubectl -n envvault create secret docker-registry registry-pull-secret \
#     --docker-server=registry.example.com --docker-username=USER --docker-password=PASSWORD
#
# The same command with  -n envvault-system  makes the one the operator needs.
# If you keep a manifest of it, name it docker-pull-secret.yaml: that name is git-ignored.
apiVersion: v1
kind: Secret
metadata:
  name: registry-pull-secret
  namespace: envvault
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_base64_of_your_docker_config_json
